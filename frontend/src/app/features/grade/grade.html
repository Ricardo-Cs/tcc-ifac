<div>
  <app-grade-toolbar
    [cursos]="cursos()"
    [cursoSelecionado]="cursoSelecionado()"
    [turmas]="turmasDoCurso()"
    [turmaSelecionada]="turmaSelecionada()"
    [totais]="totaisPorSeveridade()"
    (cursoChange)="selecionarCurso($event)"
    (turmaChange)="selecionarTurma($event)"
  />

  @if (erro()) {
    <div
      class="mx-6 mt-4 rounded-md border border-destructive/40 bg-destructive/10 px-4 py-3 text-sm text-destructive"
    >
      {{ erro() }}
    </div>
  }

  @if (carregando() && !grade()) {
    <div class="mx-6 mt-4 text-sm text-muted-foreground">Carregando a grade…</div>
  } @else if (grade()) {
    <div
      class="grid items-start gap-5 p-6"
      [class]="periodo.editavel() ? 'lg:grid-cols-[240px_1fr_320px]' : 'lg:grid-cols-[1fr_320px]'"
    >
      @if (periodo.editavel()) {
        <app-catalogo-ofertas [ofertas]="ofertasCatalogo()" />
      }

      <app-grade-tabela
        [linhas]="linhas()"
        [celulaAlvo]="celulaAlvo()"
        [idsEmFoco]="idsEmFoco()"
        [editavel]="periodo.editavel()"
        [vendoTodos]="vendoTodos()"
        [vendoVariasTurmas]="vendoVariasTurmas()"
        (sobrevoar)="aoSobrevoar($event)"
        (soltar)="aoSoltar($event)"
        (iniciarArraste)="aoIniciarArraste($event)"
        (terminarArraste)="aoTerminarArraste()"
        (remover)="remover($event)"
      />

      <app-conflitos-painel
        [conflitos]="conflitos()"
        [escopo]="escopoConflitos()"
        [aceitandoChave]="aceitandoChave()"
        (focar)="conflitoEmFoco.set($event)"
        (abrirAceite)="abrirAceite($event)"
        (cancelarAceite)="cancelarAceite()"
        (confirmarAceite)="confirmarAceite($event)"
      />
    </div>
  }
</div>
