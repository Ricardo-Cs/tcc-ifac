<section class="overflow-x-auto">
  <!-- Sem título aqui: o curso em exibição já está escrito no select acima. -->
  <table
    class="w-full min-w-[640px] border-separate border-spacing-0 overflow-hidden rounded-xl border border-border bg-card">
    <thead>
      <tr>
        <th class="w-20 border-b border-border bg-muted/50"></th>
        @for (dia of dias; track dia.num) {
        <th class="border-b border-l border-border bg-muted/50 p-2.5 text-sm font-semibold">
          {{ dia.nome }}
        </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (linha of linhas(); track linha.turnoRotulo + '-' + linha.faixa) {
      <tr>
        <th class="border-b border-border bg-muted/50 p-2 text-center align-middle whitespace-nowrap">
          <span class="block text-xs font-semibold text-foreground">{{ linha.turnoRotulo }}</span>
          <span class="block text-[0.68rem] font-medium text-muted-foreground">
            {{ linha.faixa }}
          </span>
        </th>
        @for (celula of linha.celulas; track celula.dia) {
        <td class="h-20 border-b border-l border-border p-1.5 align-top transition-colors"
          [class.bg-accent]="ehAlvo(celula)" [class.ring-2]="ehAlvo(celula)" [class.ring-inset]="ehAlvo(celula)"
          [class.ring-ring]="ehAlvo(celula)" (dragover)="sobrevoar.emit({ celula, evento: $event })"
          (drop)="soltar.emit({ celula, evento: $event })">
          @for (item of celula.aulas; track item.aula.id) {
          <app-aula-cartao [vm]="item" [editavel]="editavel()" [vendoTodos]="vendoTodos()"
            [vendoVariasTurmas]="vendoVariasTurmas()" [emFoco]="idsEmFoco().has(item.aula.id)"
            (iniciarArraste)="iniciarArraste.emit($event)" (terminarArraste)="terminarArraste.emit()"
            (remover)="remover.emit($event)" />
          }
        </td>
        }
      </tr>
      }
    </tbody>
  </table>
</section>
