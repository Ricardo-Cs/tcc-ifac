<div
  class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-border bg-card px-6 py-2.5"
>
  <div class="flex flex-wrap items-center gap-2">
    @if (cursos().length) {
      <app-select-busca
        class="w-full sm:w-80"
        [opcoes]="opcoesCurso()"
        [valor]="cursoSelecionado()"
        placeholder="Curso"
        vazio="Nenhum curso encontrado."
        (valorChange)="cursoChange.emit($event)"
      />
    }

    @if (turmas().length) {
      <app-select-busca
        class="w-full sm:w-72"
        [opcoes]="opcoesTurma()"
        [valor]="turmaSelecionada()"
        placeholder="Turma"
        vazio="Nenhuma turma encontrada."
        (valorChange)="turmaChange.emit($event)"
      />
    }
  </div>

  <div class="flex flex-wrap items-center gap-3">
    <div class="flex gap-1.5">
      <span
        class="rounded-full px-2.5 py-1 text-xs font-medium"
        [class]="pillForte()"
        [class.opacity-40]="!totais().FORTE"
        >{{ totais().FORTE }} fortes</span
      >
      <span
        class="rounded-full px-2.5 py-1 text-xs font-medium"
        [class]="pillPotencial()"
        [class.opacity-40]="!totais().POTENCIAL"
        >{{ totais().POTENCIAL }} potenciais</span
      >
      <span
        class="rounded-full px-2.5 py-1 text-xs font-medium"
        [class]="pillFraco()"
        [class.opacity-40]="!totais().FRACO"
        >{{ totais().FRACO }} fracos</span
      >
    </div>

    @if (editavel()) {
      <button
        hlmBtn
        variant="outline"
        size="sm"
        class="gap-1.5"
        type="button"
        [disabled]="gerando()"
        (click)="gerarInicial.emit()"
      >
        <ng-icon name="lucideWandSparkles" size="1rem" />
        {{ gerando() ? 'Gerando…' : 'Gerar rascunho inicial' }}
      </button>
    }

    @if (periodo(); as p) {
      @if (p.status === 'PUBLICADO') {
        <a
          hlmBtn
          variant="outline"
          size="sm"
          class="gap-1.5"
          [routerLink]="['/publica', p.codigo]"
          target="_blank"
        >
          <ng-icon name="lucideGlobe" size="1rem" />
          Grade pública
        </a>
      }
      <button hlmBtn size="sm" class="gap-1.5" type="button" (click)="publicar.emit()">
        <ng-icon name="lucideSend" size="1rem" />
        {{ p.status === 'PUBLICADO' ? 'Atualizar publicação' : 'Publicar' }}
      </button>
    }
  </div>
</div>
