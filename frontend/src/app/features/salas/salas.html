<div class="p-6">
  <app-listagem
    [itens]="salas()"
    [colunas]="colunas"
    [filtros]="filtros"
    [textoBusca]="textoBusca"
    [mostrarImportar]="false"
    entidade="salas"
    (adicionar)="abrirNovo()"
  >
    <ng-template appLinhaListagem let-s>
      <td class="px-4 py-3 font-medium text-foreground">{{ s.nome }}</td>
      <td class="px-4 py-3 text-muted-foreground">{{ rotuloTipo(s.tipo) }}</td>
      <td class="px-4 py-3 text-muted-foreground">{{ s.capacidade ?? '—' }}</td>
      <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-0.5">
          <button
            hlmBtn
            variant="ghost"
            size="icon-sm"
            type="button"
            title="Editar"
            (click)="editar(s)"
          >
            <ng-icon name="lucidePencil" size="1rem" />
          </button>
          <button
            hlmBtn
            variant="ghost"
            size="icon-sm"
            type="button"
            title="Remover"
            class="text-muted-foreground hover:text-destructive"
            (click)="pedirRemocao(s)"
          >
            <ng-icon name="lucideTrash2" size="1rem" />
          </button>
        </div>
      </td>
    </ng-template>
  </app-listagem>
</div>

<!-- Criar/editar: o cromo vem do app-form-dialog; aqui só o ícone e o formulário. -->
<app-form-dialog
  [aberto]="dialogAberto()"
  [titulo]="tituloDialog()"
  descricao="Espaço físico onde uma aula pode ser alocada."
  [salvando]="salvando()"
  [erro]="erroForm()"
  (fechar)="fecharDialog()"
  (salvar)="salvar()"
>
  <ng-icon formDialogIcone name="lucideDoorOpen" size="1.15rem" />

  <form class="grid gap-4" (ngSubmit)="salvar()">
    <div class="grid gap-1.5">
      <label
        class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
        for="sala-nome"
        >Nome</label
      >
      <input
        hlmInput
        id="sala-nome"
        [ngModel]="rascunho().nome"
        name="nome"
        (ngModelChange)="atualizar('nome', $event)"
        placeholder="Ex.: Laboratório 1"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div class="grid gap-1.5">
        <label class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
          >Tipo</label
        >
        <hlm-select
          [ngModel]="rascunho().tipo"
          name="tipo"
          [itemToString]="rotuloTipo"
          (ngModelChange)="atualizar('tipo', $event)"
        >
          <hlm-select-trigger class="w-full">
            <hlm-select-value placeholder="Selecione o tipo" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (t of tiposSala; track t.valor) {
              <hlm-select-item [value]="t.valor">{{ t.rotulo }}</hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>
      </div>

      <div class="grid gap-1.5">
        <label
          class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
          for="sala-capacidade"
          >Capacidade <span class="normal-case text-muted-foreground/70">(opcional)</span></label
        >
        <input
          hlmInput
          id="sala-capacidade"
          type="number"
          min="0"
          step="1"
          [ngModel]="rascunho().capacidade"
          name="capacidade"
          (ngModelChange)="atualizar('capacidade', $event)"
          placeholder="Ex.: 30"
        />
      </div>
    </div>
  </form>
</app-form-dialog>

<!-- Confirmar remoção: destrutivo, então nunca num clique só. -->
<app-confirm-dialog
  [aberto]="removendo() !== null"
  titulo="Remover sala"
  [processando]="salvando()"
  (fechar)="cancelarRemocao()"
  (confirmar)="confirmarRemocao()"
>
  Remover <strong>{{ removendo()?.nome }}</strong
  >? Esta ação não pode ser desfeita.
</app-confirm-dialog>
