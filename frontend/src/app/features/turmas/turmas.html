<div class="p-6">
  <app-listagem
    [itens]="turmas()"
    [colunas]="colunas"
    [filtros]="filtros"
    [textoBusca]="textoBusca"
    [mostrarImportar]="false"
    entidade="turmas"
    (adicionar)="abrirNovo()"
  >
    <ng-template appLinhaListagem let-t>
      <td class="px-4 py-3">
        <span
          class="inline-flex items-center rounded-md bg-primary/10 px-2 py-0.5 text-xs font-semibold tracking-wide text-primary"
          >{{ t.cursoSigla }}</span
        >
      </td>
      <td class="px-4 py-3 font-medium text-foreground">{{ t.nome }}</td>
      <td class="px-4 py-3 text-muted-foreground">{{ t.semestreEntrada }}</td>
      <td class="px-4 py-3 text-muted-foreground">{{ t.quantidadeAlunos ?? '—' }}</td>
      <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-0.5">
          <button
            hlmBtn
            variant="ghost"
            size="icon-sm"
            type="button"
            title="Editar"
            (click)="editar(t)"
          >
            <ng-icon name="lucidePencil" size="1rem" />
          </button>
          <button
            hlmBtn
            variant="ghost"
            size="icon-sm"
            type="button"
            title="Remover"
            class="text-muted-foreground hover:text-destructive"
            (click)="pedirRemocao(t)"
          >
            <ng-icon name="lucideTrash2" size="1rem" />
          </button>
        </div>
      </td>
    </ng-template>
  </app-listagem>
</div>

<!-- Criar/editar: o cromo vem do app-form-dialog; aqui só o ícone e o formulário. -->
<app-form-dialog
  [aberto]="dialogAberto()"
  [titulo]="tituloDialog()"
  descricao="Turma pertence a um curso (curso › turma da grade)."
  [salvando]="salvando()"
  [erro]="erroForm()"
  (fechar)="fecharDialog()"
  (salvar)="salvar()"
>
  <ng-icon formDialogIcone name="lucideGraduationCap" size="1.15rem" />

  <form class="grid gap-4" (ngSubmit)="salvar()">
    <div class="grid gap-1.5">
      <label class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
        >Curso</label
      >
      <hlm-select
        [ngModel]="rascunho().cursoId"
        name="curso"
        [itemToString]="rotuloCurso"
        (ngModelChange)="atualizar('cursoId', $event)"
      >
        <hlm-select-trigger class="w-full">
          <hlm-select-value placeholder="Selecione o curso" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (c of cursos(); track c.id) {
            <hlm-select-item [value]="c.id">{{ c.sigla }} — {{ c.nome }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="grid gap-1.5">
      <label
        class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
        for="turma-nome"
        >Nome</label
      >
      <input
        hlmInput
        id="turma-nome"
        [ngModel]="rascunho().nome"
        name="nome"
        (ngModelChange)="atualizar('nome', $event)"
        placeholder="Ex.: SI 2024.1"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div class="grid gap-1.5">
        <label
          class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
          for="turma-ingresso"
          >Semestre de ingresso</label
        >
        <input
          hlmInput
          id="turma-ingresso"
          [ngModel]="rascunho().semestreEntrada"
          name="semestreEntrada"
          (ngModelChange)="atualizar('semestreEntrada', $event)"
          placeholder="Ex.: 2024.1"
        />
      </div>

      <div class="grid gap-1.5">
        <label
          class="text-[0.7rem] font-semibold uppercase tracking-wide text-muted-foreground"
          for="turma-alunos"
          >Alunos <span class="normal-case text-muted-foreground/70">(opcional)</span></label
        >
        <input
          hlmInput
          id="turma-alunos"
          type="number"
          min="0"
          step="1"
          [ngModel]="rascunho().quantidadeAlunos"
          name="quantidadeAlunos"
          (ngModelChange)="atualizar('quantidadeAlunos', $event)"
          placeholder="Ex.: 40"
        />
      </div>
    </div>
  </form>
</app-form-dialog>

<!-- Confirmar remoção: destrutivo, então nunca num clique só. -->
<app-confirm-dialog
  [aberto]="removendo() !== null"
  titulo="Remover turma"
  [processando]="salvando()"
  (fechar)="cancelarRemocao()"
  (confirmar)="confirmarRemocao()"
>
  Remover <strong>{{ removendo()?.cursoSigla }} — {{ removendo()?.nome }}</strong
  >? Esta ação não pode ser desfeita.
</app-confirm-dialog>
